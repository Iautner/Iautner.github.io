<!doctype html>
<html lang="{{ site.data.metadata.language }}" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">

<head>
    <meta charset="utf-8">
    <title>{{ site.data.metadata.title }}</title>
    <meta name="description" content="{{ site.data.metadata.description }}">
    
    <!-- Enhanced viewport for modern devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- PWA and mobile optimizations -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lautner">
    <meta name="application-name" content="Lautner">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <!-- Performance and SEO -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    
    <!-- Icons and manifest -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="assets/css/primer.css" as="style">
    <link rel="preload" href="assets/css/custom.css" as="style">
    <link rel="preload" href="assets/js/lazy-load.js" as="script">
    
    <!-- CSS with enhanced loading -->
    <link rel="stylesheet" href="assets/css/primer.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="assets/css/custom.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.css" media="print" onload="this.media='all'">
    
    <noscript>
        <link rel="stylesheet" href="assets/css/primer.css">
        <link rel="stylesheet" href="assets/css/custom.css">
        <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
    </noscript>
    
    <!-- Enhanced Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="Lautner's Links">
    <meta property="og:description" content="Fun Minecraft content, modded Minecraft, let's play, and challenge videos!">
    <meta property="og:image" content="{{ '/assets/img/thumbnail-og.png' | absolute_url }}">
    <meta property="og:site_name" content="Lautner">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lautner's Links">
    <meta name="twitter:description" content="Fun Minecraft content, modded Minecraft, let's play, and challenge videos!">
    <meta name="twitter:image" content="{{ '/assets/img/thumbnail-og.png' | absolute_url }}">
    
    <!-- Enhanced Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</head>

<body class="p-3">
    <!-- TopBar: Linktree-style quick actions (theme toggle, native share) -->
    <div class="fixed left-0 right-0 top-0 z-[200] transition-[transform,opacity] duration-300 ease-out flex justify-center" data-testid="TopBar" id="TopBar">
        <div class="w-full max-w-profileContainer flex justify-between gap-x-2 px-[var(--link-gap)] py-[var(--link-gap)] sm:px-[calc(var(--link-gap)*2)]">
            <!-- Left: theme toggle -->
            <button id="TopBarThemeToggle" class="flex h-10 items-center justify-center transition active:scale-[0.95] border border-gray-300 dark:border-gray-600 focus:outline-none bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-700 w-10 rounded-full" aria-label="Toggle theme">
                <svg fill="none" height="18px" width="18px" viewBox="0 0 28 28" aria-hidden="true"><path d="M64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320z" fill="currentColor"></path></svg>
            </button>

            <!-- Right: share / actions -->
            <div id="topbar-buttons" class="flex gap-x-2">
                <button id="TopBarShare" class="flex h-10 items-center justify-center transition active:scale-[0.95] border border-gray-300 dark:border-gray-600 focus:outline-none bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-700 w-10 rounded-full" aria-label="Share profile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"></path></svg>
                </button>
            </div>
        </div>
    </div>
    <main class="container-md mt-20">
        {% include profile.html %}
        {% include interests.html %}
        {% include links.html %}
        {% include footer.html %}
    </main>
    
    <!-- Enhanced scripts -->
    <script src="assets/js/lazy-load.js"></script>
    
    <!-- Minimal initialization -->
    <script>
        // Prevent zoom on double tap (iOS Safari) but allow scrolling
        let lastTouchEnd = 0;
        document.addEventListener('touchend', event => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                // Only prevent default for non-scrollable elements
                if (!event.target.closest('.scrollable, main, body')) {
                    event.preventDefault();
                }
            }
            lastTouchEnd = now;
        }, false);
    </script>
    <!-- TopBar behavior: theme toggle and native share -->
    <script>
        (function () {
            const themeToggle = document.getElementById('TopBarThemeToggle');
            const shareBtn = document.getElementById('TopBarShare');

            function applyTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
                try { localStorage.setItem('site-theme', isDark ? 'dark' : 'light'); } catch (e) {}
            }

            // Initialize from saved preference or system
            try {
                const saved = localStorage.getItem('site-theme');
                if (saved === 'dark' || saved === 'light') applyTheme(saved === 'dark');
                else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme(true);
            } catch (e) {}

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const isDark = document.documentElement.classList.toggle('dark');
                    try { localStorage.setItem('site-theme', isDark ? 'dark' : 'light'); } catch (e) {}
                });
            }

            if (shareBtn) {
                shareBtn.addEventListener('click', async () => {
                    const shareData = { title: document.title || 'Profile', url: location.href };
                    if (navigator.share) {
                        try { await navigator.share(shareData); } catch (e) { /* user cancelled */ }
                    } else if (navigator.clipboard) {
                        try { await navigator.clipboard.writeText(location.href); alert('Link copied'); } catch (e) { prompt('Copy link', location.href); }
                    } else {
                        prompt('Share this link', location.href);
                    }
                });
            }
        })();
    </script>
</body>

</html>
